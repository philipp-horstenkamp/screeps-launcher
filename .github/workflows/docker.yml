name: Build Docker Images

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches:
      - main
      - codex/update-github-workflows-for-matrix-build
    tags:
      - 'v*'

  workflow_dispatch:

jobs:
  build-and-push-variants:
    name: Build and push ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
          - platform: linux/arm/v7
            suffix: armv7
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU provides cross-architecture emulation so BuildKit can execute
      # Dockerfile commands for non-native targets (e.g., building ARM images
      # on the hosted x86_64 runner). This keeps the matrix builds consistent
      # without requiring dedicated ARM runners.
      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
        # metadata-action returns fully qualified tags in outputs.tags. In this
        # job the values already include the architecture suffix from the
        # flavor above (e.g., ":main-amd64" or ":v1.2.3-armv7"), so we can
        # push the per-architecture images without manually rebuilding the tag
        # strings.

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        if: steps.push.outputs.digest != ''
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-manifest:
    name: Publish multi-arch manifests
    needs: build-and-push-variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
        # Here outputs.tags contains the canonical tag list without
        # architecture suffixes (e.g., ":main" or ":v1.2.3"). The manifest
        # step below loops over this list so each tag points to a manifest list
        # composed of the previously published amd64/arm64/armv7 images.

      # Docker/Buildx cannot build multi-platform images in a single job when
      # per-architecture suffixes are applied. Instead, we build and push each
      # architecture-specific image in the matrix job above. Here we stitch the
      # architecture variants back together under the canonical tag using
      # "imagetools create". This produces a manifest list so users can pull a
      # single tag and receive the correct image for their platform (including
      # Raspberry Pi arm/v7 and arm64).
      - name: Create and push multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            echo "Creating manifest for ${tag}"
            docker buildx imagetools create \
              -t "${tag}" \
              "${tag}-amd64" \
              "${tag}-arm64" \
              "${tag}-armv7"
          done

      - name: Inspect primary image
        run: |
          first_tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          docker buildx imagetools inspect "$first_tag"
